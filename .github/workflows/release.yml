name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...

  release:
    name: Build and publish binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while read -r goos goarch; do
            suffix=""
            if [[ "$goos" == "windows" ]]; then
              suffix=".exe"
            fi
            output="dist/skipack-${goos}-${goarch}${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "$output" ./cmd/skipack
          done <<'TARGETS'
          windows amd64
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          TARGETS
          (cd dist && sha256sum skipack-* > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*
          --verify-tag
          --generate-notes
          --title "skipack ${{ github.ref_name }}"
