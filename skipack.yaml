  python:
    - source: https://github.com/Jeffallan/claude-skills/tree/main/skills/python-pro

  # Bash : robustesse et analyse statique
  bash:
    - source: https://github.com/wshobson/agents/tree/main/plugins/shell-scripting/skills/bash-defensive-patterns
    - source: https://github.com/wshobson/agents/tree/main/plugins/shell-scripting/skills/shellcheck-configuration

