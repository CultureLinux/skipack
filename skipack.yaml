  php:
    - source: https://github.com/Jeffallan/claude-skills/tree/main/skills/php-pro

  # JavaScript navigateur et Node.js
  javascript:
    - source: https://github.com/Jeffallan/claude-skills/tree/main/skills/javascript-pro

  # TypeScript strict
  typescript:
    - source: https://github.com/Jeffallan/claude-skills/tree/main/skills/typescript-pro

