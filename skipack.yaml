  bash-testing:
    - source: https://github.com/wshobson/agents/tree/main/plugins/shell-scripting/skills/bats-testing-patterns

  # SQL : requêtes, schémas, index, performances
  sql:
    - source: https://github.com/Jeffallan/claude-skills/tree/main/skills/sql-pro

  # Docker et Docker Compose
  docker:
    - source: https://github.com/Jeffallan/claude-skills/tree/main/skills/devops-engineer

  # GitHub Actions
  github-actions:
    - source: https://github.com/wshobson/agents/tree/main/plugins/cicd-automation/skills/github-actions-templates

  # GitLab CI/CD
  gitlab-ci:
    - source: https://github.com/wshobson/agents/tree/main/plugins/cicd-automation/skills/gitlab-ci-patterns
